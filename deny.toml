# cargo-deny configuration
# See: embarkstudios.github.io/cargo-deny/

[advisories]
ignore = [
  # paste: unmaintained, no safe upgrade available. Pulled in transitively by
  # ratatui (taskit-tui's dep). Revisit when ratatui drops it or a fork lands.
  "RUSTSEC-2024-0436",
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
