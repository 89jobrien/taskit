- id: taskit-1
  doob_uuid: null
  name: crux-feature-gating
  priority: P2
  status: open
  title: Gate crux behind a Cargo feature + runtime --flag, matching Cicero's per-capability model
  description: |-
    taskit-init no longer generates a Cruxfile unconditionally: added InitPlan.crux (bool,
    default false, interactive-prompt-only, mirrors the existing xtask gate) and renamed the
    output file Cruxfile -> ci.crux to match the convention already used by CiConfig.cruxfile,
    test fixtures, and the init-pipeline-runner design doc. This part is done but uncommitted.

    Remaining, not yet implemented: add a `crux` Cargo feature to taskit-engine (gating
    SubprocessCruxRunner, optional taskit-crux dependency) and taskit (propagating the feature
    up for `cargo install taskit --features crux`), default-off, plus a runtime --crux CLI flag
    on the CI-dispatch subcommand that errors clearly if the flag is passed without the feature
    compiled in. Modeled on Cicero (codeberg.org/trem/cicero): `cicero init` ships with every
    optional feature (cache, distribution, workspace, commands, etc.) off by default and opts in
    per-capability -- taskit-crux should follow the same pattern given it currently has zero
    callers outside its own crate (see taskit-crux/src/lib.rs TODO(#29)) and isn't even a
    dependency of the root taskit binary today.
  files:
  - crates/taskit-init/src/plan.rs
  - crates/taskit-init/src/lib.rs
  - crates/taskit-init/src/render_toml.rs
  - crates/taskit-init/src/render_cruxfile.rs
  - crates/taskit-init/src/scaffold.rs
  completed: null
  extra: []
